.dg-m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
.dg-sweep{animation:dg-sweep 7s ease-in-out infinite}
@keyframes dg-sweep{0%{transform:translateX(0);opacity:1}72%{transform:translateX(204px);opacity:1}84%{transform:translateX(204px);opacity:0}99%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
.dg-row{animation:dg-row 7s steps(1,end) infinite}
