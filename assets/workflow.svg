<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="dg-title dg-desc">
<title id="dg-title">Deepgram Usage</title>
<desc id="dg-desc">Illustration of read-only usage analytics over a bounded date range of at most 31 days. A date slider selects eight days. Usage in hours and tokens is drawn as bars on the left, and billed dollars as separate bars on the right. A faint waveform is only background context; nothing is transcribed. Illustrative synthetic data.</desc>
