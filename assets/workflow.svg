.dg-bl{transform-box:fill-box;transform-origin:100% 50%;animation:dg-b 4.2s ease-in-out infinite}
.dg-br{transform-box:fill-box;transform-origin:0% 50%;animation:dg-b 4.2s ease-in-out infinite}
@keyframes dg-b{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
.dg-win{animation:dg-win 7s ease-in-out infinite}
@keyframes dg-win{0%,100%{fill-opacity:.2}50%{fill-opacity:.32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
